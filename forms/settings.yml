sections:
  - key: site
    label: Site
    elements:
      - type: text
        key: siteUrl
        label: Site URL
        help: >-
          Optional. Leave blank to use the site address set for the page's application in CMS
          Settings > Applications. Set it only to override that. When set, it must be the site's
          public https address, e.g. https://www.example.com, and every page is checked there.
      - type: button
        label: Save
        action: saveSite
        style: primary
  - key: graph
    label: Optimizely Graph
    elements:
      - type: secret
        key: singleKey
        label: Single key
        help: >-
          Required. Find it in the CMS under Settings > API Keys. It reads only published
          content, which is what visitors see. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveGraph
        style: primary
  - key: cms
    label: CMS API client
    elements:
      - type: text
        key: clientId
        label: Client ID
        help: >-
          Required. Create an API client in the CMS under Settings > API Keys; read access is
          enough. It reads the version open in the editor, tells deleted content from
          unpublished content and reads the site hosts in Settings > Applications.
      - type: secret
        key: clientSecret
        label: Client secret
        help: Required. Shown once, when the API client is created. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveCms
        style: primary
