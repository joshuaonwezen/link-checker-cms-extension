sections:
  - key: site
    label: Site
    elements:
      - type: text
        key: siteUrl
        label: Site URL
        help: >-
          The public address of the website this CMS publishes to, starting with https://,
          e.g. https://www.example.com. Links to your own pages are opened there, the way a
          visitor would follow them.
      - type: button
        label: Save
        action: saveSite
        style: primary
  - key: graph
    label: Optimizely Graph
    elements:
      - type: secret
        key: singleKey
        label: Single key
        help: >-
          Find it in the CMS under Settings > API Keys. It can only read published content,
          which is what visitors see. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveGraph
        style: primary
  - key: cms
    label: CMS API client
    elements:
      - type: text
        key: clientId
        label: Client ID
        help: >-
          Create an API client in the CMS under Settings > API Keys; read access is enough. It
          reads the page open in the editor and tells deleted content from unpublished content.
      - type: secret
        key: clientSecret
        label: Client secret
        help: Shown once, when the API client is created. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveCms
        style: primary
