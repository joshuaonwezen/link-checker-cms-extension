sections:
  - key: site
    label: Site
    elements:
      - type: text
        key: siteUrl
        label: Site URL
        help: >-
          The front end for this CMS instance, e.g. https://optimizely-onboarding.vercel.app.
          Internal links are opened there, the way a visitor would follow them.
      - type: button
        label: Save
        action: saveSite
        style: primary
  - key: graph
    label: Optimizely Graph
    elements:
      - type: secret
        key: singleKey
        label: Single key
        help: >-
          The instance's Graph single key (CMS → Settings → API Keys). It only reads published
          content, which is what a link needs to work for visitors. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveGraph
        style: primary
  - key: cms
    label: CMS API client
    elements:
      - type: text
        key: clientId
        label: Client ID
        help: >-
          CMS → Settings → API Keys. Used to read the version open in the editor and to tell
          deleted content from unpublished content.
      - type: secret
        key: clientSecret
        label: Client secret
        help: Shown once when the API key is created. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveCms
        style: primary
